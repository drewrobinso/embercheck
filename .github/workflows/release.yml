# Build the Windows installer natively on GitHub's windows-latest runner and sign it with SignPath (SignPath Foundation
# OSS certificate). Every signing request needs manual approval in SignPath (policy requirement).
#
# One-time setup (see README > Code signing policy / Building):
#   * Repository secret   SIGNPATH_API_TOKEN       - API token of the SignPath CI user (submitter role)
#   * Repository variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG
#     (the values below are placeholders/defaults used when the variables are not set)
#   * In SignPath: artifact configurations "app" and "installer" = packaging/signpath/app.xml / installer.xml
#
# Without SIGNPATH_API_TOKEN the workflow still builds and uploads UNSIGNED artifacts, but never publishes a release.
name: build-and-release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID || '00000000-0000-0000-0000-000000000000' }}  # placeholder
  SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG || 'bambu-print-optimizer' }}                    # placeholder
  SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}            # 'test-signing' until approved

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      signed: ${{ steps.flags.outputs.signed }}
    env:
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path src\bambu_optimizer.py -Pattern "^VERSION = '(.+)'").Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne "v$v") { throw "tag $env:GITHUB_REF_NAME does not match VERSION $v" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Unit checks
        shell: pwsh
        run: |
          python -m py_compile (Get-ChildItem src\*.py).FullName
          python src\bambu_optimizer.py --self-test

      - name: Build app (PyInstaller, windowed one-folder)
        run: python -m PyInstaller packaging\PrintOptimizer.spec --noconfirm --clean --distpath dist --workpath build\pyi

      - name: Self-test the frozen exe
        shell: pwsh
        run: |
          $p = Start-Process dist\PrintOptimizer\PrintOptimizer.exe -ArgumentList '--self-test','--report','selftest.txt' -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "frozen self-test failed ($($p.ExitCode))" }

      - name: Upload unsigned app
        id: upload-app
        uses: actions/upload-artifact@v7
        with:
          name: app-unsigned
          path: dist/PrintOptimizer/
          if-no-files-found: error

      - name: Sign app (SignPath)
        if: env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.ver.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600   # allows time for the manual approval
          output-artifact-directory: signed-app

      - name: Use signed app for the installer
        if: env.HAS_SIGNPATH == 'true'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist\PrintOptimizer
          Copy-Item -Recurse signed-app dist\PrintOptimizer
          Get-AuthenticodeSignature dist\PrintOptimizer\PrintOptimizer.exe | Format-List Status,SignerCertificate

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          python scripts\make_portable_zip.py

      - name: Upload unsigned installer
        id: upload-installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-unsigned
          path: dist/PrintOptimizer-Setup-${{ steps.ver.outputs.version }}.exe
          if-no-files-found: error

      - name: Sign installer (SignPath)
        if: env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.ver.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installer

      - name: Collect release files
        id: flags
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $v = '${{ steps.ver.outputs.version }}'
          if ($env:HAS_SIGNPATH -eq 'true') {
            Copy-Item "signed-installer\PrintOptimizer-Setup-$v.exe" release\
            $sig = Get-AuthenticodeSignature "release\PrintOptimizer-Setup-$v.exe"
            $sig | Format-List Status,StatusMessage,SignerCertificate,TimeStamperCertificate
            if ($sig.Status -ne 'Valid') { throw "installer signature is not valid: $($sig.Status)" }
            "signed=true" >> $env:GITHUB_OUTPUT
          } else {
            Copy-Item "dist\PrintOptimizer-Setup-$v.exe" release\
            "signed=false" >> $env:GITHUB_OUTPUT
          }
          Copy-Item "dist\BambuPrintOptimizer-$v-python.zip" release\
          Get-ChildItem release | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.Name } | Tee-Object release\SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: release/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: release
      - name: Create draft GitHub release with the signed installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes \
            --title "Bambu Print Optimizer ${{ needs.build.outputs.version }}"
